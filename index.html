<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/pwa-icon.png" />
    <link rel="apple-touch-icon" href="/assets/pwa-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="server monitor, Komari Monitor, server uptime monitoring, real-time server status, server performance dashboard, monitoring tool" />
    <meta name="theme-color" content="#aa99ec" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Komari Monitor" />
    <meta property="og:title" content="Komari Monitor" />
    <meta property="og:description" content="A simple server monitor tool." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Komari Monitor" />
    <meta name="twitter:description" content="A simple server monitor tool." />
    <title>Komari Monitor</title>
    <meta name="description" content="A simple server monitor tool." />
    <style>
      /* 首屏壳：JS/CSS 到达前先画一版加载页，避免白屏和暗色闪白 */
      html {
        background: #f1eef9;
        color-scheme: light;
      }
      html[data-boot-theme="dark"] {
        background: #08080c;
        color-scheme: dark;
      }
      #boot-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        --boot-text: #1a1822;
        --boot-muted: #6a6678;
        --boot-accent: #8b76e6;
        --boot-accent-2: #b6a9f2;
        background: radial-gradient(
            58% 52% at 15% 8%,
            rgba(163, 146, 232, 0.42),
            transparent 62%
          ),
          radial-gradient(
            52% 48% at 86% 90%,
            rgba(116, 152, 240, 0.3),
            transparent 64%
          ),
          #f1eef9;
        font-family: "Inter", "Noto Sans CJK SC", "WenQuanYi Zen Hei",
          system-ui, sans-serif;
        color: var(--boot-text);
        -webkit-font-smoothing: antialiased;
      }
      html[data-boot-theme="dark"] #boot-shell {
        --boot-text: #f3f2f8;
        --boot-muted: #9b96a8;
        --boot-accent: #a693ee;
        --boot-accent-2: #7d6ad8;
        background: radial-gradient(
            58% 52% at 15% 8%,
            rgba(124, 103, 212, 0.36),
            transparent 62%
          ),
          radial-gradient(
            52% 48% at 86% 90%,
            rgba(80, 116, 198, 0.26),
            transparent 64%
          ),
          #08080c;
      }
      #boot-shell .boot-inner {
        text-align: center;
      }
      #boot-shell .boot-ring {
        width: 64px;
        height: 64px;
        margin: 0 auto 28px;
        border-radius: 50%;
        background: conic-gradient(
          from 200deg,
          transparent 0 16%,
          var(--boot-accent-2) 58%,
          var(--boot-accent) 100%
        );
        -webkit-mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3.5px),
          #000 calc(100% - 2.4px)
        );
        mask: radial-gradient(
          farthest-side,
          transparent calc(100% - 3.5px),
          #000 calc(100% - 2.4px)
        );
        animation: boot-spin 1.1s linear infinite;
      }
      #boot-shell .boot-title {
        font-size: 23px;
        font-weight: 600;
        letter-spacing: 0.03em;
        line-height: 1.2;
      }
      #boot-shell .boot-sub {
        margin-top: 11px;
        font-size: 14px;
        line-height: 1.4;
        color: var(--boot-muted);
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-shell .boot-ring {
          animation-duration: 2.6s;
        }
      }
      @media (max-width: 767px) {
        #boot-shell .boot-ring {
          width: 56px;
          height: 56px;
          margin-bottom: 24px;
        }
        #boot-shell .boot-title {
          font-size: 21px;
        }
      }
    </style>
    <script>
      // 首帧就按用户自己的外观偏好上色：显式选过亮/暗就用它，否则跟随系统
      try {
        var storedAppearance = JSON.parse(
          localStorage.getItem("appearance") || "null"
        );
        var bootTheme =
          storedAppearance === "dark" || storedAppearance === "light"
            ? storedAppearance
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.bootTheme = bootTheme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div
      id="background-container"
      class="fixed top-0 left-0 w-full h-full z-[-1]">
      <div
        id="image-background"
        class="absolute top-0 left-0 w-full h-full bg-cover bg-center bg-no-repeat z-10"></div>
      <video
        id="video-background"
        class="absolute top-0 left-0 w-full h-full object-cover object-center z-20"
        autoplay
        loop
        muted
        playsinline></video>
    </div>
    <div id="root" class="relative z-30">
      <div id="boot-shell" role="status" aria-live="polite">
        <div class="boot-inner">
          <div class="boot-ring"></div>
          <p class="boot-title">Loading</p>
          <p class="boot-sub">正在加载配置</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
